name: Build and deploy PHP app to Azure Web App - ulam-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          extensions: mbstring, intl, pdo_mysql

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ---------- FRONTEND ----------
      - name: Install frontend dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend assets
        if: hashFiles('package.json') != ''
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found in package.json, skipping."
          fi

      # ---------- BACKEND ----------
      - name: Install PHP dependencies (composer)
        if: hashFiles('composer.json') != ''
        run: |
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist

      # ---------- ARTIFACT ----------
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45E69B870B5C47DFBB68DE33FF7978F6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1EF3192C82D9418FA181E7B2B5F15CF5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7BDA0E3626514798A6B2F37AE1334A49 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ulam-app'
          slot-name: 'Production'
          package: .
